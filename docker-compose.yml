services:
  postgres-db:
    image: postgres:17
    container_name: clinica-postgres-db
    environment:
      POSTGRES_USER: clinica_user
      POSTGRES_PASSWORD: clinica_pass
      POSTGRES_DB: clinica
    ports:
      - "5433:5432"
    volumes:
      - postgres_clinica_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica_user -d clinica"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_clinica_data:
    driver: local
